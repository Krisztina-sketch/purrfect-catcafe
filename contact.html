<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purrfect Cat Café | Contact</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-brown">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">🐾 Purrfect Cat Café</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
          <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="page-header text-center">
    <div class="container">
      <h1>Contact Us</h1>
      <p>We would love to hear from you.</p>
    </div>
  </header>

  <main class="container my-5">
    <div class="row g-4">
      <div class="col-md-6">
        <h2>Get in Touch</h2>
        <p><strong>Email:</strong> info@purrfectcatcafe.com</p>
        <p><strong>Phone:</strong> 020 1234 5678</p>
        <p><strong>Location:</strong> London, UK</p>
        <p><strong>Opening Hours:</strong> Monday to Saturday, 9am - 6pm</p>
      </div>

      <div class="col-md-6">
        <form class="contact-form">
          <label for="name">Name</label>
          <input type="text" id="name" class="form-control mb-3" placeholder="Your name">

          <label for="email">Email</label>
          <input type="email" id="email" class="form-control mb-3" placeholder="Your email">

          <label for="message">Message</label>
          <textarea id="message" class="form-control mb-3" rows="5" placeholder="Your message"></textarea>

          <button type="submit" class="btn btn-brown">Send Message</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="text-center text-white p-3 bg-brown">
    <p class="mb-0">© 2026 Purrfect Cat Café</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
